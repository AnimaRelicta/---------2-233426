[project]
name = "vkr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AnimaRelicta", email = "anima.relicta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
]

[project.scripts]
vkr = "vkr:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
